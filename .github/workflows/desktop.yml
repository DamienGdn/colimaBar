name: Desktop (Linux & Windows)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths: [ "tauri/**", ".github/workflows/desktop.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "tauri/**", ".github/workflows/desktop.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tauri/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test

  build:
    name: Bundle (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Install Tauri CLI
        run: npm ci

      # Bundling downloads tools (NSIS, AppImage runtime) from GitHub releases,
      # which occasionally answer 5xx. Retry; the compiled binary is reused.
      - name: Build
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npx tauri build --bundles ${{ matrix.bundles }} && exit 0
            echo "::warning::tauri build attempt $attempt failed, retrying in 30 s"
            sleep 30
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ColimaBar-${{ matrix.name }}
          path: |
            tauri/src-tauri/target/release/bundle/deb/*.deb
            tauri/src-tauri/target/release/bundle/rpm/*.rpm
            tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            tauri/src-tauri/target/release/bundle/nsis/*.exe
            tauri/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tauri/src-tauri/target/release/bundle/deb/*.deb
            tauri/src-tauri/target/release/bundle/rpm/*.rpm
            tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            tauri/src-tauri/target/release/bundle/nsis/*.exe
            tauri/src-tauri/target/release/bundle/msi/*.msi
