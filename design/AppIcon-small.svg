<!-- Simplified variant for 16/32 px renditions (Finder list, menus). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3B4CCA"/>
      <stop offset="0.55" stop-color="#22307F"/>
      <stop offset="1" stop-color="#121A4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" gradientUnits="userSpaceOnUse" x1="0" y1="170" x2="0" y2="810">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E8F7"/>
    </linearGradient>
    <linearGradient id="boxA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA24C"/>
      <stop offset="1" stop-color="#F26B1D"/>
    </linearGradient>
    <linearGradient id="boxB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3EE0C5"/>
      <stop offset="1" stop-color="#12A894"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#060A24" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- Base squircle (macOS icon grid: 824pt body inside 1024 canvas) -->
  <g>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>

  <!-- Llama + cargo -->
  <g transform="translate(512 532) scale(1.16) translate(-512 -500)">
    <!-- cargo: two stacked containers -->
    <g>
      <rect x="452" y="410" width="252" height="128" rx="16" fill="url(#boxA)"/>
      <rect x="494" y="304" width="190" height="112" rx="16" fill="url(#boxB)"/>
    </g>

    <path d="M432 292 C 432 240, 452 202, 478 188 C 492 214, 486 258, 474 300 Z" fill="#C9D0EC"/>
    <g fill="url(#fur)">
      <!-- legs -->
      <rect x="396" y="620" width="50" height="186" rx="25"/>
      <rect x="466" y="620" width="50" height="186" rx="25"/>
      <rect x="630" y="620" width="50" height="186" rx="25"/>
      <rect x="700" y="620" width="50" height="186" rx="25"/>
      <!-- body -->
      <rect x="380" y="512" width="390" height="176" rx="88"/>
      <!-- tail -->
      <rect x="742" y="506" width="56" height="96" rx="28" transform="rotate(28 770 554)"/>
      <!-- neck -->
      <rect x="352" y="282" width="124" height="330" rx="62"/>
      <!-- head -->
      <rect x="248" y="262" width="228" height="124" rx="62"/>
      <!-- ears -->
      <path d="M398 290 C 382 236, 392 192, 414 172 C 438 194, 446 240, 440 290 Z"/>
    </g>
    <!-- face -->
    <circle cx="372" cy="314" r="22" fill="#151C4F"/>
  </g>
</svg>
