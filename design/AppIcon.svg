<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3B4CCA"/>
      <stop offset="0.55" stop-color="#22307F"/>
      <stop offset="1" stop-color="#121A4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" gradientUnits="userSpaceOnUse" x1="0" y1="170" x2="0" y2="810">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E8F7"/>
    </linearGradient>
    <linearGradient id="boxA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA24C"/>
      <stop offset="1" stop-color="#F26B1D"/>
    </linearGradient>
    <linearGradient id="boxB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3EE0C5"/>
      <stop offset="1" stop-color="#12A894"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#060A24" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- Base squircle (macOS icon grid: 824pt body inside 1024 canvas) -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- menu-bar strip -->
    <rect x="100" y="100" width="824" height="64" fill="#FFFFFF" fill-opacity="0.10"/>
    <circle cx="740" cy="132" r="13" fill="#34D399"/>
    <rect x="766" y="124" width="46" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.28"/>
    <rect x="214" y="124" width="70" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="300" y="124" width="54" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.18"/>
    <!-- ground -->
    <ellipse cx="558" cy="806" rx="250" ry="22" fill="#05081F" fill-opacity="0.35"/>
  </g>

  <!-- Llama + cargo -->
  <g filter="url(#shadow)" transform="translate(18 0)">
    <!-- cargo: two stacked containers -->
    <g>
      <rect x="452" y="410" width="252" height="128" rx="16" fill="url(#boxA)"/>
      <g fill="#B8470C" fill-opacity="0.45">
        <rect x="484" y="432" width="12" height="70" rx="6"/>
        <rect x="520" y="432" width="12" height="70" rx="6"/>
        <rect x="556" y="432" width="12" height="70" rx="6"/>
        <rect x="592" y="432" width="12" height="70" rx="6"/>
        <rect x="628" y="432" width="12" height="70" rx="6"/>
        <rect x="664" y="432" width="12" height="70" rx="6"/>
      </g>
      <rect x="494" y="304" width="190" height="112" rx="16" fill="url(#boxB)"/>
      <g fill="#0B6E61" fill-opacity="0.45">
        <rect x="524" y="324" width="12" height="72" rx="6"/>
        <rect x="560" y="324" width="12" height="72" rx="6"/>
        <rect x="596" y="324" width="12" height="72" rx="6"/>
        <rect x="632" y="324" width="12" height="72" rx="6"/>
      </g>
    </g>

    <path d="M432 292 C 432 240, 452 202, 478 188 C 492 214, 486 258, 474 300 Z" fill="#C9D0EC"/>
    <g fill="url(#fur)">
      <!-- legs -->
      <rect x="396" y="620" width="50" height="186" rx="25"/>
      <rect x="466" y="620" width="50" height="186" rx="25"/>
      <rect x="630" y="620" width="50" height="186" rx="25"/>
      <rect x="700" y="620" width="50" height="186" rx="25"/>
      <!-- body -->
      <rect x="380" y="512" width="390" height="176" rx="88"/>
      <!-- tail -->
      <rect x="742" y="506" width="56" height="96" rx="28" transform="rotate(28 770 554)"/>
      <!-- neck -->
      <rect x="352" y="282" width="124" height="330" rx="62"/>
      <!-- head -->
      <rect x="248" y="262" width="228" height="124" rx="62"/>
      <!-- ears -->
      <path d="M398 290 C 382 236, 392 192, 414 172 C 438 194, 446 240, 440 290 Z"/>
    </g>
    <!-- face -->
    <circle cx="372" cy="312" r="15" fill="#151C4F"/>
    <circle cx="377" cy="307" r="4.5" fill="#FFFFFF"/>
    <ellipse cx="268" cy="322" rx="7" ry="9" fill="#151C4F" fill-opacity="0.55"/>
    <path d="M282 356 Q300 366 318 356" stroke="#151C4F" stroke-opacity="0.5" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>
</svg>
