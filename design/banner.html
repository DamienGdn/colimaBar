<!doctype html>
<!-- README banner source. Render at 1280x420 (@2x) -> docs/banner.png -->
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 420px; font-family: "Inter", -apple-system, "SF Pro Display", sans-serif;
         background: radial-gradient(1200px 500px at 15% 0%, #3B4CCA 0%, #22307F 45%, #0E1440 100%);
         color: #fff; overflow: hidden; position: relative; }
  .grid { position: absolute; inset: 0; opacity: .10;
          background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
          background-size: 40px 40px; mask-image: linear-gradient(90deg, transparent 0%, #000 40%, #000 70%, transparent 100%); }
  .menubar { position: absolute; top: 0; left: 0; right: 0; height: 30px; background: rgba(255,255,255,.08);
             backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: flex-end; gap: 18px;
             padding: 0 22px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.85); }
  .menubar img { height: 18px; filter: invert(1); }
  .menubar .glyph { position: relative; display: flex; }
  .menubar .glyph::after { content: ""; position: absolute; right: -2px; bottom: -1px; width: 7px; height: 7px;
             border-radius: 50%; background: #34D399; box-shadow: 0 0 0 1.5px #1d2770; }
  .wrap { position: absolute; inset: 30px 0 0 0; display: flex; align-items: center; gap: 44px; padding: 0 90px; }
  .icon { width: 260px; height: 260px; flex: none; filter: drop-shadow(0 20px 40px rgba(0,0,0,.35)); }
  h1 { font-size: 84px; font-weight: 800; letter-spacing: -2.5px; line-height: 1; }
  h1 span { background: linear-gradient(90deg, #3EE0C5, #FFA24C); -webkit-background-clip: text; color: transparent; }
  p.tag { margin-top: 14px; font-size: 26px; font-weight: 400; color: rgba(255,255,255,.82); letter-spacing: -.3px; }
  .chips { margin-top: 26px; display: flex; gap: 9px; }
  .chip { font-size: 14px; font-weight: 600; padding: 7px 13px; white-space: nowrap; border-radius: 999px;
          background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.16); color: rgba(255,255,255,.92); }
  .chip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
</style></head><body>
  <div class="grid"></div>
  <div class="menubar">
    <span>Wi-Fi</span><span>100%</span>
    <span class="glyph"><img src="MenuBarIcon.svg" alt=""></span>
    <span>Mon 9:41</span>
  </div>
  <div class="wrap">
    <img class="icon" src="AppIcon.svg" alt="">
    <div>
      <h1>Colima<span>Bar</span></h1>
      <p class="tag">Colima &amp; Docker, right in your macOS menu bar.</p>
      <div class="chips">
        <span class="chip"><i style="background:#34D399"></i>Start / stop in one click</span>
        <span class="chip"><i style="background:#3EE0C5"></i>Compose-aware</span>
        <span class="chip"><i style="background:#FFA24C"></i>Live CPU &amp; RAM</span>
        <span class="chip"><i style="background:#A5B4FC"></i>Native · Apple Silicon</span>
      </div>
    </div>
  </div>
</body></html>
