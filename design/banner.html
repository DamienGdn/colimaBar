<!doctype html>
<!-- README banner source. Render at 1280x440 (@2x) -> docs/banner.png
     The product shot is docs/desktop-compose.png (UI rendered with demo data). -->
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 440px; font-family: "Inter", -apple-system, "SF Pro Display", "Segoe UI", sans-serif;
         background: radial-gradient(900px 520px at 8% 0%, #3B4CCA 0%, #22307F 48%, #0E1440 100%);
         color: #fff; overflow: hidden; position: relative; }
  .grid { position: absolute; inset: 0; opacity: .08;
          background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
          background-size: 40px 40px; mask-image: radial-gradient(700px 400px at 30% 50%, #000 0%, transparent 100%); }
  .glow { position: absolute; right: -120px; top: -80px; width: 760px; height: 600px; border-radius: 50%;
          background: radial-gradient(closest-side, rgba(62, 224, 197, .22), rgba(62, 224, 197, 0)); }

  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px;
          display: flex; flex-direction: column; justify-content: center; }
  .title { display: flex; align-items: center; gap: 20px; }
  .title img { width: 96px; height: 96px; filter: drop-shadow(0 12px 24px rgba(0,0,0,.35)); }
  h1 { font-size: 72px; font-weight: 800; letter-spacing: -2.2px; line-height: 1; }
  h1 span { background: linear-gradient(90deg, #3EE0C5, #FFA24C); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.tag { margin-top: 22px; font-size: 25px; line-height: 1.35; font-weight: 500; color: rgba(255,255,255,.92); letter-spacing: -.3px; }
  p.sub { margin-top: 10px; font-size: 16px; line-height: 1.5; color: rgba(255,255,255,.66); }

  .platforms { margin-top: 26px; display: flex; gap: 10px; }
  .pf { display: inline-flex; align-items: center; gap: 9px; padding: 8px 14px; border-radius: 10px;
        background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.16);
        font-size: 14px; font-weight: 700; letter-spacing: .1px; }
  .pf small { font-weight: 500; color: rgba(255,255,255,.62); font-size: 12.5px; }
  .pf i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* Product shot */
  .shot { position: absolute; left: 676px; top: 58px; width: 720px;
          border-radius: 14px; overflow: hidden; background: #fff;
          box-shadow: 0 40px 80px rgba(3, 6, 30, .55), 0 0 0 1px rgba(255,255,255,.18);
          transform: perspective(1600px) rotateY(-9deg) rotateX(3deg); transform-origin: left center; }
  .bar { height: 30px; background: #E9EBF3; display: flex; align-items: center; gap: 7px; padding: 0 12px; }
  .bar b { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .bar span { margin-left: 10px; font-size: 12px; font-weight: 600; color: #6B7194; }
  .shot img { display: block; width: 100%; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 90px;
          background: linear-gradient(180deg, rgba(14,20,64,0) 0%, rgba(14,20,64,.85) 100%); pointer-events: none; }
</style></head><body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="copy">
    <div class="title">
      <img src="AppIcon.svg" alt="">
      <h1>Colima<span>Bar</span></h1>
    </div>
    <p class="tag">Colima &amp; Docker, one click away —<br>from your menu bar or system tray.</p>
    <p class="sub">Containers, Compose stacks, logs and live CPU / RAM — no terminal needed.</p>
    <div class="platforms">
      <span class="pf"><i style="background:#A5B4FC"></i>macOS <small>native</small></span>
      <span class="pf"><i style="background:#3EE0C5"></i>Linux <small>deb · rpm</small></span>
      <span class="pf"><i style="background:#FFA24C"></i>Windows <small>WSL2</small></span>
    </div>
  </div>

  <div class="shot">
    <div class="bar"><b style="background:#FF5F57"></b><b style="background:#FEBC2E"></b><b style="background:#28C840"></b><span>ColimaBar</span></div>
    <img src="../docs/desktop-compose.png" alt="">
  </div>
  <div class="fade"></div>
</body></html>
