[package]
name = "colimabar"
version = "1.11.0"
description = "ColimaBar for Linux and Windows: Colima / Docker from your system tray"
authors = ["Damien Guesdon"]
license = ""
repository = "https://github.com/DamienGdn/colimaBar"
edition = "2021"
rust-version = "1.77"

[lib]
name = "colimabar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.9", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.3"
tauri-plugin-autostart = "2.5"
tauri-plugin-notification = "2.3"
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
